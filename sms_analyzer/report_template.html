<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank SMS Report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f0ec; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --income: #2a78d6; --expense: #eb6834;
  --acc-1: #4a3aa7; --acc-2: #1baf7a; --acc-3: #eda100;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --warning: #fab219;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --income: #3987e5; --expense: #d95926; --acc-1: #9085e9; --acc-2: #199e70; --acc-3: #c98500;
    --good-text: #0ca30c; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --income: #3987e5; --expense: #d95926; --acc-1: #9085e9; --acc-2: #199e70; --acc-3: #c98500;
  --good-text: #0ca30c; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
  font-size: 15px; line-height: 1.6;
}
html[lang="fa"] body { font-family: Vazirmatn, "Vazir", "Segoe UI", Tahoma, system-ui, sans-serif; line-height: 1.7; }
.page { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button, .btn { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; cursor: pointer; }
.seg[hidden] { display: none; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.btn:hover, .seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 17px; margin: 0 0 2px; font-weight: 700; }
.card .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.grid2 > section.card { margin-bottom: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; container-type: inline-size; }
.kpi .label { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: clamp(16px, 8.6cqi, 28px); font-weight: 700; margin-top: 2px; white-space: nowrap; }
.kpi .value small, .unit { font-size: 13px; font-weight: 400; color: var(--muted); margin-inline-start: 4px; }
.kpi .meta { color: var(--muted); font-size: 12.5px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw.in { background: var(--income); } .sw.out { background: var(--expense); }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; min-width: 0; }
.stat .label { color: var(--muted); font-size: 12px; }
.stat .value { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos { color: var(--good-text); } .neg { color: var(--critical); }

.insights { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; }
.insights li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.insights li .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; background: var(--surface-2); color: var(--ink-2); transform: translateY(3px); }
.insights li.good .ic { background: color-mix(in oklab, var(--good) 18%, transparent); color: var(--good-text); }
.insights li.bad .ic { background: color-mix(in oklab, var(--critical) 18%, transparent); color: var(--critical); }
.insights b { font-weight: 700; }
.warn { border-color: color-mix(in oklab, var(--warning) 55%, var(--border)); }
.warn ul, .about ul { margin: 0; padding-inline-start: 20px; color: var(--ink-2); }

.chart { position: relative; width: 100%; direction: ltr; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hl { fill: var(--ink); opacity: .05; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.ln { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

#tip { position: fixed; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .08s; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.6; box-shadow: 0 6px 24px rgba(0,0,0,.14); min-width: 170px; max-width: 320px; }
#tip .t { font-weight: 700; margin-bottom: 2px; }
#tip .r { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
#tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }

.hbars { display: flex; flex-direction: column; gap: 8px; }
.hb { display: grid; grid-template-columns: minmax(90px, var(--name-w, 34%)) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
.hb .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .nm small { color: var(--muted); }
.hb .tr { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hb .fl { height: 100%; border-radius: 4px; background: var(--expense); min-width: 2px; }
.hb .fl.in { background: var(--income); }
.hb .vl { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: end; min-width: 92px; }
.hb:hover .nm { font-weight: 700; }
.rank { display: inline-block; width: 1.7em; color: var(--muted); }

.cals { display: flex; flex-wrap: wrap; gap: 20px; }
.cal { flex: 1 1 240px; max-width: 330px; }
.cal .mh { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.cal .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal .wd { font-size: 11px; color: var(--muted); text-align: center; }
.cal .c { aspect-ratio: 1; border-radius: 5px; display: grid; place-items: center; font-size: 11.5px; background: var(--surface-2); color: var(--ink-2); }
.cal .c.blank { background: transparent; }
.cal .c.l1, .scale .l1 { background: color-mix(in oklab, var(--expense) 18%, var(--surface-2)); }
.cal .c.l2, .scale .l2 { background: color-mix(in oklab, var(--expense) 38%, var(--surface-2)); color: var(--ink); }
.cal .c.l3, .scale .l3 { background: color-mix(in oklab, var(--expense) 62%, var(--surface-2)); color: #fff; }
.cal .c.l4, .scale .l4 { background: var(--expense); color: #fff; font-weight: 700; }
.cal .c:hover { outline: 2px solid var(--ink); outline-offset: -1px; }
.scale { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.scale i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; background: var(--surface-2); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.tools input, .tools select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); min-width: 0; }
.tools input[type=search] { flex: 1 1 200px; }
.tools input.d { width: 120px; direction: ltr; text-align: center; }
.tbl-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 700; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; font-size: 12.5px; z-index: 1; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable::after { content: " ↕"; color: var(--muted); font-weight: 400; }
th.sorted-asc::after { content: " ▲"; color: var(--ink); }
th.sorted-desc::after { content: " ▼"; color: var(--ink); }
tbody tr:hover td { background: color-mix(in oklab, var(--ink) 3%, transparent); }
td.num { font-variant-numeric: tabular-nums; }
td.long { white-space: normal; min-width: 140px; }
tr.clickable { cursor: pointer; }
tr.raw td { background: var(--surface-2); white-space: pre-wrap; font-size: 12.5px; color: var(--ink-2); unicode-bidi: plaintext; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.badge.in::before, .badge.out::before { content: ""; width: 8px; height: 8px; border-radius: 2px; }
.badge.in::before { background: var(--income); } .badge.out::before { background: var(--expense); }
.share { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; margin-inline-start: 6px; overflow: hidden; }
.share i { display: block; height: 100%; background: var(--expense); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
details { margin-top: 8px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
details pre { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 12.5px; margin: 8px 0; color: var(--ink-2); unicode-bidi: plaintext; }
details pre .lnr { color: var(--muted); font-size: 11px; display: block; }
footer { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 24px; }

@media (max-width: 1000px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2, .insights { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .page { padding: 16px 16px 48px; }
  h1 { font-size: 21px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hb { grid-template-columns: minmax(0, 1fr) auto; }
  .hb .tr { grid-column: 1 / -1; grid-row: 2; }
  section.card { padding: 16px; }
}
@media print {
  body { background: #fff; }
  .controls, .tools, .pager, #tip { display: none !important; }
  section.card, .kpi, .stat { box-shadow: none; break-inside: avoid; }
}
@media (forced-colors: active) { .hb .fl, .sw, .badge::before { forced-color-adjust: none; } }
</style>
</head>

    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language"><button data-lang="en">English</button><button data-lang="fa">فارسی</button></div>
      <div class="seg" role="group" id="calSeg"><button data-cal="gregorian"></button><button data-cal="jalali"></button></div>
      <div class="seg" role="group" id="unitSeg" hidden><button data-unit="rial"></button><button data-unit="toman"></button></div>
      <div class="seg" role="group" id="themeSeg"><button data-theme-btn="auto"></button><button data-theme-btn="light"></button><button data-theme-btn="dark"></button></div>
      <button class="btn" id="csvBtn"></button>
      <button class="btn" id="printBtn"></button>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>

<script>

function compact(v) {
  const x = conv(v);
  if (lang === "en") return new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(x);
  const a = Math.abs(x), s = x < 0 ? "−" : "", f = n => num(n, 1);

}

// Gregorian -> Jalali (same algorithm as the Python side)
function g2j(gy, gm, gd) {
  const gdm = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + gdm[gm - 1];
  let jy = -1595 + 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
  return [jy, jm, jd];
}
const ymd = iso => { const [y, m, d] = iso.split("-").map(Number); return cal() === "jalali" ? g2j(y, m, d) : [y, m, d]; };
const wdOf = iso => (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7;        // 0 = Monday
const monthName = m => MONTHS[cal()][lang][m - 1];
function fmtDate(iso, long) {
  if (!iso) return "—";
  const [y, m, d] = ymd(iso);
  if (long) return lang === "fa" ? `${num(d)} ${monthName(m)} ${digits(y)}` : `${d} ${monthName(m).slice(0, 3)} ${y}`;
  return digits(`${y}/${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}`);
}

function el(tag, attrs, parent) {

function niceTicks(min, max, count) {
  if (max === min) max = min + 1;
  const step0 = (max - min) / (count || 5);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const n = step0 / mag;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v / step) * step);
  return out;
}
function barPath(x, y, w, h, r, top) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return top
    ? `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`
    : `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
}

function renderBalance() {

  const all = accs.flatMap(a => a.points);
  const t0 = Math.min(...all.map(p => p.ts)), t1 = Math.max(...all.map(p => p.ts));
  const ticks = niceTicks(Math.min(...all.map(p => p.v)), Math.max(...all.map(p => p.v)), 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = ts => m.l + (t1 === t0 ? pw / 2 : (ts - t0) / (t1 - t0) * pw), y = v => m.t + (hi - v) / (hi - lo || 1) * ph;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": t("balance") }, box);
  const g = el("g", { class: "grid" }, svg);

  el("line", { class: "base", x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }, svg);
  const dayMs = 86400000, step = Math.max(1, Math.ceil(Math.max(1, Math.round((t1 - t0) / dayMs)) / Math.max(2, Math.floor(pw / 90))));
  for (let k = 0; k < DATA.daily.length; k += step) {
    const ts = S.firstTs + k * dayMs;
    if (ts < t0 - dayMs || ts > t1) continue;
    const xx = x(Math.max(ts, t0)), [, mo, dd] = ymd(DATA.daily[k].d);
    el("line", { class: "base", x1: xx, x2: xx, y1: H - m.b, y2: H - m.b + 4 }, svg);

  }

    let p = "";
    a.points.forEach((pt, k) => { const X = x(pt.ts).toFixed(1), Y = y(pt.v).toFixed(1); p += k ? `H${X}V${Y}` : `M${X},${Y}`; });
    el("path", { d: p, fill: "none", stroke: colors[i], "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    const last = a.points[a.points.length - 1];
    el("circle", { cx: x(last.ts), cy: y(last.v), r: 4.5, fill: colors[i], stroke: "var(--surface)", "stroke-width": 2 }, svg);
  });
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dots = accs.map((a, i) => el("circle", { r: 4.5, fill: colors[i], stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg));
  const hit = el("rect", { class: "hit", x: m.l, y: m.t, width: pw, height: ph }, svg);
  const at = (pts, ts) => { let lo2 = 0, hi2 = pts.length - 1, ans = -1; while (lo2 <= hi2) { const mid = (lo2 + hi2) >> 1; if (pts[mid].ts <= ts) { ans = mid; lo2 = mid + 1; } else hi2 = mid - 1; } return ans; };
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width), ts = t0 + (px - m.l) / pw * (t1 - t0);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    let html = "", head = "";
    accs.forEach((a, i) => {
      const k = at(a.points, ts);
      if (k < 0) { dots[i].setAttribute("visibility", "hidden"); return; }
      const pt = a.points[k];
      if (!head) head = `${fmtDate(pt.d, true)} ${digits(pt.t)}`;
      dots[i].setAttribute("cx", x(pt.ts)); dots[i].setAttribute("cy", y(pt.v)); dots[i].setAttribute("visibility", "visible");
      html += `<div class="r"><span><i class="ln" style="width:12px;background:${colors[i]}"></i>${esc(accountName(a))}</span><b>${esc(moneyT(pt.v))}</b></div>`;
    });
    if (html) showTip(`<div class="t">${esc(head)}</div>${html}`, ev); else hideTip();
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); hideTip(); });
}

function keepFocus(host, id, fn) {

    const pos = inp.selectionStart;

  });
}

    <td class="num">${pct(m.share)}<span class="share"><i style="width:${(m.share / maxShare * 100).toFixed(1)}%"></i></span></td><td>${fmtDate(m.last)}</td></tr>`).join("")}</tbody></table></div>`;
  sortable(b, mState, renderMerchantTable);
  keepFocus(b, "#mq", v => { mState.q = v; renderMerchantTable(); });
}

const tState = { key: "ts", dir: 1, q: "", dirF: "", cat: "", from: "", to: "", page: 0, open: -1 };
const PAGE = 50;
function renderTxns() {
  const b = body("txns"), q = tState.q.trim().toLowerCase();
  const asIso = s => {           // the date filter is typed in the visible calendar; compare as yyyy/mm/dd strings
    s = s.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/-/g, "/");
    const p = s.split("/").map(Number);
    return p.length === 3 && p.every(n => n > 0) ? `${p[0]}/${String(p[1]).padStart(2, "0")}/${String(p[2]).padStart(2, "0")}` : "";
  };
  const shown = x => x.d ? fmtDate(x.d).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)) : "";
  const from = asIso(tState.from), to = asIso(tState.to);
  let list = DATA.transactions.map((x, i) => Object.assign({ i }, x)).filter(x =>
    (!tState.dirF || (x.dir || "unk") === tState.dirF) && (!tState.cat || x.category === tState.cat) &&
    (!from || (x.d && shown(x) >= from)) && (!to || (x.d && shown(x) <= to)) &&
    (!q || [x.party, x.desc, catName(x.category), x.tracking, x.raw, String(x.amount)].some(s => s && String(s).toLowerCase().includes(q))));
  if (tState.key !== "ts") list.sort((a, c) => cmp(a, c, tState.key) * tState.dir); else if (tState.dir < 0) list.reverse();
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  tState.page = Math.min(tState.page, pages - 1);
  const slice = list.slice(tState.page * PAGE, tState.page * PAGE + PAGE);
  const local = list.filter(x => !x.foreign);
  const sIn = local.filter(x => x.dir === "in").reduce((s, x) => s + x.amount, 0);
  const sOut = local.filter(x => x.dir === "out").reduce((s, x) => s + x.amount + (x.fee || 0), 0);
  const cats = [...new Set(DATA.transactions.map(x => x.category))].sort((a, c) => catName(a).localeCompare(catName(c), lang));
  const badge = x => x.dir === "in" ? `<span class="badge in">${t("credit")}</span>` : x.dir === "out" ? `<span class="badge out">${t("debit")}</span>` : `<span class="badge">${t("unknown")}</span>`;
  const amt = x => x.foreign ? `${new Intl.NumberFormat(locale(), { maximumFractionDigits: 2 }).format(x.amount)} ${esc(x.currency || "")}` : money(x.amount);
  const ph = cal() === "jalali" ? "1405/01/01" : "2026-01-01";
  b.innerHTML = `<div class="tools">
    <input type="search" id="tq" placeholder="${t("search")}" value="${esc(tState.q)}">
    <select id="tdir"><option value="">${t("all")}</option><option value="in">${t("onlyIn")}</option><option value="out">${t("onlyOut")}</option><option value="unk">${t("unknown")}</option></select>
    <select id="tcat"><option value="">${t("allCats")}</option>${cats.map(c => `<option value="${esc(c)}">${esc(catName(c))}</option>`).join("")}</select>
    <input class="d" id="tfrom" placeholder="${t("from")} ${ph}" value="${esc(tState.from)}"><input class="d" id="tto" placeholder="${t("to")} ${ph}" value="${esc(tState.to)}">
  </div>
  <p class="hint" style="margin:0 0 8px">${t("txnSummary", { n: num(list.length), i: compact(sIn), o: compact(sOut) })} ${esc(unitLabel())}</p>
  <div class="tbl-wrap"><table><thead><tr><th data-k="ts">${t("dateTime")}</th><th>${t("day")}</th><th data-k="dir">${t("type")}</th>
    <th data-k="amount" data-num="1">${t("amount")}</th><th data-k="balance" data-num="1">${t("balanceCol")}</th><th data-k="party">${t("party")}</th>
    <th data-k="category">${t("category")}</th><th>${t("ref")}</th></tr></thead><tbody>${slice.map(x => `
    <tr class="clickable" data-i="${x.i}"><td>${x.d ? fmtDate(x.d) : "—"} <small style="color:var(--muted)">${digits(x.time)}</small></td><td>${x.d ? WD[lang][wdOf(x.d)] : ""}</td>
    <td>${badge(x)}</td><td class="num">${amt(x)}${x.fee ? ` <small style="color:var(--muted)">${t("plusFee", { v: money(x.fee) })}</small>` : ""}</td>
    <td class="num">${x.balance != null ? (x.foreign ? num(x.balance, 2) : money(x.balance)) : "—"}</td><td class="long">${esc(partyName(x))}</td><td>${esc(catName(x.category))}</td>
    <td class="num">${esc(x.tracking || "—")}</td></tr>
    ${tState.open === x.i ? `<tr class="raw"><td colspan="8">${esc(x.raw)}<br><small>${t("line", { n: num(x.line) })} · ${x.template ? t("viaTemplate", { s: esc(x.template) }) : t("viaBuiltin")}${x.bank ? " · " + esc(x.bank) : ""}${x.account ? " · " + esc(x.account) : ""}${x.chainOk === false ? " · " + t("chainBad") : x.chainOk ? " · " + t("chainOk") : ""}</small></td></tr>` : ""}`).join("")}
  </tbody></table></div>
  <div class="pager"><button class="btn" id="prev" ${tState.page === 0 ? "disabled" : ""}>${t("prev")}</button><span>${t("page", { p: num(tState.page + 1), n: num(pages) })}</span><button class="btn" id="next" ${tState.page >= pages - 1 ? "disabled" : ""}>${t("next")}</button></div>`;
  b.querySelector("#tdir").value = tState.dirF;
  b.querySelector("#tcat").value = tState.cat;
  sortable(b, tState, () => { tState.page = 0; renderTxns(); });
  [["#tq", "q"], ["#tdir", "dirF"], ["#tcat", "cat"], ["#tfrom", "from"], ["#tto", "to"]].forEach(([id, k]) => keepFocus(b, id, v => { tState[k] = v; tState.page = 0; renderTxns(); }));
  b.querySelector("#prev").addEventListener("click", () => { tState.page--; renderTxns(); });
  b.querySelector("#next").addEventListener("click", () => { tState.page++; renderTxns(); });
  b.querySelectorAll("tr.clickable").forEach(tr => tr.addEventListener("click", () => { const i = +tr.dataset.i; tState.open = tState.open === i ? -1 : i; renderTxns(); }));
}

function renderOthers() {
  const b = body("others");
  if (!b) return;
  const block = (items, title) => items.length ? `<details><summary>${title} (${num(items.length)})</summary>${items.map(o =>
    `<pre><span class="lnr">${t("line", { n: num(o.line) })}${o.reason ? " · " + t(o.reason) : ""}</span>${esc(o.text)}</pre>`).join("")}</details>` : "";
  b.innerHTML = block(DATA.others, t("nonFinancial")) + block(DATA.duplicates, t("duplicates"));
}
function renderAbout() {
  const hits = Object.entries(S.templateHits || {}).sort((a, c) => c[1] - a[1]);
  body("about").innerHTML = `<ul>${hits.map(([k, n]) => `<li>${k ? t("aboutTpl", { n: num(n), s: esc(k) }) : t("aboutBuiltin", { n: num(n) })}</li>`).join("")}</ul>`;
}

// ======================================================================= CSV & controls
document.getElementById("csvBtn").addEventListener("click", () => {
  const head = ["date", "jalali_date", "time", "direction", "amount", "currency", "fee", "balance", "merchant_or_party", "category", "description", "reference", "bank", "account", "template"];
  const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const jal = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); const j = g2j(y, m, d); return `${j[0]}/${String(j[1]).padStart(2, "0")}/${String(j[2]).padStart(2, "0")}`; };
  const lines = [head.join(",")].concat(DATA.transactions.map(x => [x.d, jal(x.d), x.time, x.dir || "", x.amount, x.currency, x.fee || 0, x.balance,
    partyName(x), catName(x.category), x.desc, x.tracking, x.bank, x.account, x.template].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = "transactions.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById("printBtn").addEventListener("click", () => window.print());
const pressed = (sel, attr, val) => document.querySelectorAll(sel).forEach(b => b.setAttribute("aria-pressed", b.getAttribute(attr) === val));
bind("[data-lang]", "click", e => { lang = e.currentTarget.dataset.lang; store.set("sms-lang", lang); renderAll(true); });
bind("[data-cal]", "click", e => { calPref = e.currentTarget.dataset.cal; store.set("sms-cal", calPref); renderAll(true); });
bind("[data-unit]", "click", e => { unit = e.currentTarget.dataset.unit; store.set("sms-unit", unit); renderAll(false); });
bind("[data-theme-btn]", "click", e => {
  const v = e.currentTarget.dataset.themeBtn;
  if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v);
  store.set("sms-theme", v); pressed("[data-theme-btn]", "data-theme-btn", v);
});
const savedTheme = store.get("sms-theme");
if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
pressed("[data-theme-btn]", "data-theme-btn", savedTheme === "light" || savedTheme === "dark" ? savedTheme : "auto");

function renderCharts() { renderDaily(); renderBalance(); renderWeekday(); renderHourly(); }
function renderAll(full) {
  if (full) layout();
  pressed("[data-lang]", "data-lang", lang);
  pressed("[data-cal]", "data-cal", cal());
  pressed("[data-unit]", "data-unit", unit);
  renderKpis(); renderInsights(); renderTopDays(); renderCalendar(); renderMerchants();
  catList("cats", DATA.categories); catList("incats", DATA.incomeCategories, "in"); renderSources();
  renderMonthly(); renderTop("topexp", DATA.topExpenses); renderTop("topinc", DATA.topIncomes);
  renderMerchantTable(); renderTxns(); renderOthers(); renderAbout(); renderCharts();
}
renderAll(true);
let rt, lastW = window.innerWidth;
window.addEventListener("resize", () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rt); rt = setTimeout(renderCharts, 120); });
})();
</script>
</body>
</html>
